generated: '2026-07-21'
method: searched
status: published
source: https://docs.reltio.com/en/developer-resources/ai-integrations
notes: >-
  Reltio ships two Model Context Protocol servers. (1) The Reltio AgentFlow
  MCP Server — a fully-managed, hosted SaaS MCP gateway exposed per environment
  at https://<env>.reltio.com/ai/tools/mcp (OAuth 2.0, dynamic client
  registration + PKCE via login.reltio.com). (2) The Reltio MCP Server —
  Developer Edition — an open-source, self-hosted Apache-2.0 Python server
  (github.com/reltio-ai/reltio-mcp-server) that runs over HTTP/SSE and
  authenticates to the Reltio platform with OAuth 2.0 client credentials.
servers:
- name: reltio-agentflow-mcp
  edition: AgentFlow MCP Server (managed SaaS)
  transport: http
  url_pattern: https://<environment>.reltio.com/ai/tools/mcp
  example_url: https://dev.reltio.com/ai/tools/mcp
  auth:
    type: oauth2
    issuer: https://dev.reltio.com/ai/tools
    authorization_endpoint: https://login.reltio.com
    token_endpoint: https://login.reltio.com/token
    registration_endpoint: https://dev.reltio.com/ai/tools/register
    grant_types: [authorization_code]
    code_challenge_methods: [S256]
    token_endpoint_auth_methods: [client_secret_basic]
  evidence: dev.reltio.com/.well-known/oauth-authorization-server (HTTP 200)
- name: reltio-mcp-server-developer
  edition: Developer Edition (open source, self-hosted)
  transport: sse
  repo: https://github.com/reltio-ai/reltio-mcp-server
  license: Apache-2.0
  language: Python
  default_endpoint: http://localhost:8000/sse
  auth:
    type: oauth2
    grant_types: [client_credentials]
  install: mcp install --with requests --with pyyaml main.py -f .env
sample_clients:
- name: reltio-mcp-strands-client
  repo: https://github.com/reltio-ai/reltio-mcp-strands-client
  description: Sample Python client connecting Strands AI agents to the Reltio AgentFlow MCP Server (OAuth 2.0)
