aid: reltio
name: Reltio
description: >-
  Reltio is a cloud-native, AI-native master data management (MDM) and Context
  Intelligence Platform that unifies, cleanses, harmonizes, governs, and
  activates enterprise data from many sources in real time. It delivers trusted
  "golden records" via multidomain MDM, LLM-driven entity resolution, data
  quality, and data integration (1,000+ connectors), and exposes that governed
  data to AI agents through AgentFlow and a Model Context Protocol (MCP) server.
  Founded in 2011 and headquartered in Redwood Shores, CA, Reltio became part of
  SAP SE in May 2026 and is being integrated into SAP Business Data Cloud while
  remaining available standalone.
